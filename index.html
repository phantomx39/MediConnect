<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal Login - City General Hospital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-staff-snake"></i>
                </div>
                <h1>City General Hospital</h1>
                <p>Patient Access Portal</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="patientId">Patient ID</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-id-card input-icon"></i>
                        <input type="text" id="patientId" placeholder="Enter your Patient ID" autocomplete="username">
                    </div>
                    <span class="error-message" id="idError"></span>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-actions">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Secure Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div style="text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted);">
                    <p><strong>Test Patient:</strong> patient / 123</p>
                </div>
            </form>

            <div class="footer-links">
                <p>New patient? <a href="register.html">Register here</a></p>
                <p style="margin-top: 10px;">Are you an Admin? <a href="admin-login.html">Admin Login</a></p>
                <p class="secure-badge" style="margin-top: 10px;"><i class="fa-solid fa-shield-halved"></i> 256-bit SSL Scured</p>
            </div>
        </div>

        <div class="background-decor">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="script.js"></script>
</body>

</html>
