<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - City General Hospital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="register-container">
        <div class="register-card">
            <div class="brand-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-staff-snake"></i>
                </div>
                <h1>Create an Account</h1>
                <p>Register for the Patient Access Portal</p>
            </div>

            <form id="registerForm" class="register-form">
                <div class="form-row">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="text" id="firstName" placeholder="First Name">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="text" id="lastName" placeholder="Last Name">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="example@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Create password">
                            <button type="button" class="toggle-password" data-target="password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm password">
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-actions mt-3">
                    <div class="terms-check">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy
                                Policy</a>.</label>
                    </div>
                </div>

                <span class="error-message" id="globalError"></span>

                <button type="submit" class="register-btn mt-3">
                    <span>Complete Registration</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="footer-links">
                <p>Already have an account? <a href="index.html">Log in here</a></p>
            </div>
        </div>

        <div class="background-decor">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="register.js"></script>
</body>

</html>
